<!DOCTYPE html>
<html>
<body style="margin:0;background:#f4f1eb;font-family:Arial,Helvetica,sans-serif;color:#1c1813;">
  <div style="max-width:560px;margin:0 auto;padding:32px 20px;">
    <div style="background:#fff;border:1px solid #e6dfd2;border-radius:18px;padding:36px;">
      <div style="font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:#ff7759;margin-bottom:16px;">Confirm your account</div>
      <h1 style="font-size:26px;line-height:1.2;margin:0 0 12px;color:#17150f;">Confirm your signup for GTR by Vero UK</h1>
      <p style="font-size:15px;line-height:1.6;color:#5f574c;margin:0 0 24px;">Enter this code on the site to finish creating your account:</p>
      <p style="text-align:center;margin:0 0 24px;">
        <span style="display:inline-block;background:#17150f;color:#fff;font-family:'Space Mono',monospace;font-size:28px;letter-spacing:6px;font-weight:700;padding:16px 28px;border-radius:14px;">{{ .Token }}</span>
      </p>
      <p style="font-size:13px;line-height:1.6;color:#9b8c77;margin:0;">This code expires in 1 hour. If you didn't try to sign up, you can ignore this email.</p>
    </div>
    <p style="text-align:center;font-size:12px;color:#9b8c77;margin:18px 0 0;">© GTR by Vero UK</p>
  </div>
</body>
</html>
