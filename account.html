<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My account — GTR by Vero UK</title>
<link rel="icon" type="image/jpeg" href="favicon.jpeg">
<link rel="apple-touch-icon" href="favicon.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="dashboard.css">
</head>
<body class="dash">

  <div class="dash-loading" id="loading">Loading your account…</div>

  <!-- Sign in / sign up gate -->
  <div class="dash-gate" id="gate" hidden>
    <div class="modal__card">
      <div class="eyebrow eyebrow--sm eyebrow--mb-sm">Your account</div>
      <h2 class="modal__title" id="gate-title">Sign in</h2>
      <form class="form" id="gate-form">
        <label class="field"><span>Email</span><input name="email" type="email" required autocomplete="email"/></label>
        <label class="field"><span>Password</span><input name="password" type="password" required autocomplete="current-password" minlength="6"/></label>
        <div class="auth-error" id="gate-error" hidden></div>
        <div class="auth-ok" id="gate-ok" hidden></div>
        <button type="submit" class="btn btn--lg btn--dark btn--block" id="gate-submit">Sign in</button>
      </form>
      <p class="modal__note">
        <span id="gate-toggle-text">New here?</span>
        <button class="link-btn" id="gate-toggle" data-gate-toggle>Create an account</button>
      </p>
      <p class="gate-note" id="gate-note"><a class="dash-link" href="index.html">← Back to site</a></p>
    </div>
  </div>

  <!-- Account view -->
  <div id="app" hidden>
    <header class="dash-top">
      <div class="dash-top__inner">
        <div class="footer-mark">
          <span class="brand-dot"></span>
          <span class="brand-text">
            <span class="brand-name">GTR</span>
            <span class="brand-sub">My account</span>
          </span>
        </div>
        <div class="dash-who">
          <span id="who-email"></span>
          <a class="dash-link-light" href="index.html">Back to site ↗</a>
          <button class="btn btn--xs btn--ghost-dark" data-signout>Sign out</button>
        </div>
      </div>
    </header>

    <main class="dash-main">
      <div class="dash-stats" id="stat-cards"></div>
      <div class="dash-tabs" id="tabs"></div>
      <div id="table-area"></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="vero-backend.js"></script>
  <script src="account.js"></script>
</body>
</html>
